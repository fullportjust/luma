<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Room — Lumi Nuru</title>
<meta name="description" content="Book your private KTV room or massage session at Lumi Nuru. Choose your service, pick a time, and we'll confirm availability.">

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:title" content="Book a Room — Lumi Nuru">
<meta property="og:description" content="Book your private KTV room or massage session at Lumi Nuru. Choose your service, pick a time, and we'll confirm availability.">

<link rel="alternate" hreflang="th" href="https://lumimassagektv.com/?lang=th">
<link rel="alternate" hreflang="zh" href="https://lumimassagektv.com/?lang=zh">
<link rel="alternate" hreflang="ja" href="https://lumimassagektv.com/?lang=ja">
<link rel="alternate" hreflang="ko" href="https://lumimassagektv.com/?lang=ko">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",

</head>
<body>
<div id="nav-mount"></div>

<section style="padding:3rem 0 1rem">
  <div class="wrap">
    <p class="eyebrow" data-i18n="book.eyebrow">Reservations</p>
    <h1 class="gold" style="font-size:clamp(2.2rem,6vw,3.6rem)" data-i18n="book.title">Book a Room</h1>
    <p class="lead" style="margin-top:.5rem" data-i18n="book.intro">Fill in your details below, then tap a messaging app to send — we'll confirm availability right away. No payment online.</p>
  </div>
</section>

<section style="padding:1rem 0">
  <div class="wrap"><div class="gallery book-gallery" id="book-gallery"></div></div>
</section>

<section style="padding-top:1.5rem">
  <div class="wrap" style="max-width:760px">
    <div class="form-card">

      <div class="field">
        <label data-i18n="book.q1">1 · What are you here for?</label>
        <div class="chip-row" id="service-chips">
          <div class="chip sel" data-v="KTV" data-i18n="book.svc.ktv">🎤 Private KTV</div>
          <div class="chip" data-v="Massage" data-i18n="book.svc.massage">💆 Massage &amp; Spa</div>
          <div class="chip" data-v="Combo" data-i18n="book.svc.combo">✨ KTV + Massage</div>
        </div>
      </div>

      <div id="ktv-opts">
        <div class="field"><label data-i18n="book.roomsize">Room size</label>
          <select id="room">
            <option value="Small Room (4–6) · ฿800/2hr" data-i18n="book.room.small">Small Room · 4–6 persons · ฿800 / 2hr</option>
            <option value="Large Room (8–12) · ฿1,200/2hr" data-i18n="book.room.large">Large Room · 8–12 persons · ฿1,200 / 2hr</option>
          </select></div>
      </div>

      <div id="massage-opts" style="display:none">
        <div class="field"><label data-i18n="book.course">Course</label>
          <select id="course">
            <optgroup label="Shower Room">
              <option>Thai Massage · 40 min · ฿2,000</option>
              <option>Thai Massage · 60 min · ฿2,500</option>
              <option>Thai Massage · 90 min · ฿3,000</option>
            </optgroup>
            <optgroup label="Jacuzzi Room">
              <option>Oil + Soapy · 60 min · ฿2,800</option>
              <option>Oil + Soapy · 90 min · ฿3,400</option>
              <option>B2B + Soapy · 60 min · ฿3,100</option>
              <option>B2B + Soapy · 90 min · ฿3,700</option>
            </optgroup>
            <optgroup label="VIP Room">
              <option>Nuru Massage · 60 min · ฿3,800</option>
              <option>Nuru Massage · 90 min · ฿5,000</option>
              <option>Nuru (2 ladies) · 60 min · ฿7,500</option>
            </optgroup>
          </select></div>
      </div>

      <div id="combo-opts" style="display:none">
        <div class="field"><label data-i18n="book.combo">Combo package</label>
          <select id="combo">
            <option value="KTV 1hr + Nuru 1hr · ฿4,900">KTV 1 hr + Nuru 1 hr · ฿4,900</option>
            <option value="KTV 30min + Massage 1hr · ฿3,500">KTV 30 min + Massage 1 hr · ฿3,500</option>
          </select></div>
      </div>

      <div class="field">
        <label data-i18n="book.q2">2 · When?</label>
        <div class="date-wrap">
          <input type="date" id="date" class="date-real">
          <div class="date-fake" id="date-fake" onclick="document.getElementById('date').showPicker()"></div>
        </div>
        <select id="time" style="width:100%;margin-top:.7rem" data-i18n-placeholder="book.time.placeholder"><option value="" data-i18n="book.time.placeholder">Select a time…</option></select>
      </div>

      <div class="field">
        <label data-i18n="book.q3">3 · How many guests?</label>
        <select id="guests" style="width:100%">
          <option value="1" selected data-i18n="book.guests.1">1 guest</option><option value="2" data-i18n="book.guests.2">2 guests</option>
          <option value="3" data-i18n="book.guests.3">3 guests</option><option value="4" data-i18n="book.guests.4">4 guests</option>
          <option value="5" data-i18n="book.guests.5">5 guests</option><option value="6" data-i18n="book.guests.6">6 guests</option>
          <option value="8" data-i18n="book.guests.8">7–8 guests</option><option value="12" data-i18n="book.guests.12">9–12 guests</option>
        </select>
      </div>

      <div class="field">
        <label data-i18n="book.q4">4 · Your name</label>
        <input type="text" id="name" data-i18n-placeholder="book.name.placeholder" placeholder="Your name" style="width:100%">
      </div>

      <div class="field">
        <label data-i18n="book.notes.label">Special requests (optional)</label>
        <textarea id="notes" rows="2" data-i18n-placeholder="book.notes.placeholder" placeholder="Preferred therapist, occasion, song list…"></textarea>
      </div>

      <div class="field">
        <label data-i18n="book.summary">Your reservation</label>
        <div class="summary" id="summary"></div>
      </div>

      <div style="display:flex;flex-direction:column;gap:.7rem">
        <button class="btn btn-gold" style="width:100%;justify-content:center" onclick="sendVia('line')">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#1b0f3a" style="margin-right:.4rem"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63h2.386c.349 0 .63.285.63.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.271.173-.508.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>
          Request via LINE
        </button>
        <button class="btn" style="width:100%;justify-content:center;background:#25d366;color:#fff;border:none" onclick="sendVia('whatsapp')">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#fff" style="margin-right:.4rem"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Request via WhatsApp
        </button>
      </div>
      <p class="note" style="text-align:center;margin-top:1rem" data-i18n="book.note">Strictly 20+. We confirm availability before anything is final.</p>
    </div>
  </div>
</section>

<div id="toast" class="toast"></div>
<div id="footer-mount"></div>
<script src="assets.js"></script>
<script src="i18n.js"></script>
<script src="shared.js"></script>
<script>
let service='KTV';

mountChrome('book.html');
document.getElementById('book-gallery').innerHTML = `
  <div class="tile"><img src="${LN_IMG.ktv}" alt="KTV room"></div>
  <div class="tile"><img src="${LN_IMG.massage}" alt="VIP suite"></div>`;

const timeSel=document.getElementById('time');
const slots=[];
for(let h=11;h<=23;h++){slots.push({v:h+':00',l:(h<12?h+':00 AM':h===12?'12:00 PM':(h-12)+':00 PM')});slots.push({v:h+':30',l:(h<12?h+':30 AM':h===12?'12:30 PM':(h-12)+':30 PM')});}
['00:00','00:30','01:00','01:30','02:00','02:30'].forEach(t=>{const hr=parseInt(t);slots.push({v:t,l:(hr===0?'12':hr)+t.slice(2)+' AM (next day)'});});
slots.forEach(s=>{const o=document.createElement('option');o.value=s.v;o.textContent=s.l;timeSel.appendChild(o);});
const d=document.getElementById('date');const today=new Date();d.min=today.toISOString().split('T')[0];d.value=today.toISOString().split('T')[0];
function syncDateFake(){const v=d.value;if(v){const dt=new Date(v+"T00:00");document.getElementById("date-fake").textContent=dt.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"});}else{document.getElementById("date-fake").textContent=typeof t==="function"?t("book.date.placeholder"):"Pick a date…";}}
d.addEventListener("change",syncDateFake);syncDateFake();

document.querySelectorAll('#service-chips .chip').forEach(c=>{
  c.addEventListener('click',()=>{
    document.querySelectorAll('#service-chips .chip').forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel');service=c.dataset.v;
    document.getElementById('ktv-opts').style.display=service==='KTV'?'block':'none';
    document.getElementById('massage-opts').style.display=service==='Massage'?'block':'none';
    document.getElementById('combo-opts').style.display=service==='Combo'?'block':'none';
    updateSummary();
  });
});

function val(id){const e=document.getElementById(id);return e?e.value:'';}

function buildDetails(){
  const l=[];
  l.push(['Service',service==='KTV'?'Private KTV':service==='Massage'?'Massage & Spa':'KTV + Massage Combo']);
  if(service==='KTV'){l.push(['Room',val('room').split(' · ')[0]]);}
  else if(service==='Massage'){l.push(['Course',val('course')]);}
  else{l.push(['Package',val('combo').split(' · ')[0]]);}
  const dt=val('date'),tm=val('time');
  l.push(['Date',dt?new Date(dt+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}):'—']);
  l.push(['Time',tm?tm.padStart(5,'0'):'—']);
  l.push(['Guests',val('guests')]);
  return l;
}

function buildMsg(){
  let msg=`Hi! I'd like to make a reservation at Lumi Nuru.`;
  const details=buildDetails();
  details.forEach(([k,v])=>{msg+=`\n${k}: ${v}`;});
  const nm=val('name').trim();
  if(nm) msg+=`\nName: ${nm}`;
  if(val('notes').trim()) msg+=`\nNote: ${val('notes').trim()}`;
  return msg;
}

function updateSummary(){
  document.getElementById('summary').innerHTML=buildDetails().map(([k,v])=>`<div class="row"><span>${k}</span><span>${v}</span></div>`).join('');
}
['room','course','combo','date','time','guests'].forEach(id=>{const e=document.getElementById(id);if(e)e.addEventListener('change',updateSummary);});
updateSummary();
function onLangChange(){ updateSummary(); }

function toast(m){const t=document.getElementById('toast');t.innerHTML=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3600);}

function sendVia(platform){
  if(!val('time')){toast('Please choose a <b>time</b>.');document.getElementById('time').focus();return;}
  if(!val('name').trim()){toast('Please add your <b>name</b>.');document.getElementById('name').focus();return;}

  const msg = buildMsg();
  const encoded = encodeURIComponent(msg);

  if(platform==='line'){
    // Copy message to clipboard, then open LINE chat
    copyText(msg).then(()=>{
      toast('Message copied! Paste it in LINE.');
      setTimeout(()=>{ location.href='https://line.me/R/ti/p/@370nwatk'; }, 300);
    }).catch(()=>{
      // Fallback: show copy modal if clipboard fails
      showCopyModal(msg);
    });
  } else if(platform==='whatsapp'){
    location.href = `https://wa.me/660828943665?text=${encoded}`;
  }
}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(txt);
  return new Promise((resolve,reject)=>{
    const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:-9999px;top:-9999px';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');resolve();}catch(e){reject(e);}
    document.body.removeChild(ta);
  });
}
function showCopyModal(msg){
  let modal = document.getElementById('copy-modal');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'copy-modal';
    modal.innerHTML = `<div class="copy-modal-overlay" onclick="if(event.target===this)closeCopyModal()">
      <div class="copy-modal">
        <button class="cm-close" onclick="closeCopyModal()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <h3 style="font-family:var(--serif);color:var(--gold-bright);font-size:1.3rem;margin-bottom:.5rem">Copy your message</h3>
        <p style="color:var(--muted);font-size:.88rem;margin-bottom:1rem">Tap below to copy, then paste it in LINE.</p>
        <div id="copy-modal-text" style="background:rgba(15,8,38,.6);border:1px solid var(--line);border-radius:10px;padding:.8rem;font-size:.88rem;color:var(--ink);max-height:200px;overflow-y:auto;white-space:pre-wrap;margin-bottom:1rem"></div>
        <button class="btn btn-gold cm-copy-btn" style="width:100%;justify-content:center" onclick="copyModalMsg()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy message</button>
        <a href="https://line.me/R/oaChat/@370nwatk" class="btn btn-ghost cm-line-btn" style="width:100%;justify-content:center;margin-top:.5rem;gap:.6rem" onclick="copyModalMsg()"><svg viewBox="0 0 24 24" width="20" height="20" fill="#06c755" style="flex-shrink:0"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63h2.386c.349 0 .63.285.63.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.271.173-.508.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg> Open LINE</a>
      </div>
    </div>`;
    document.body.appendChild(modal);
  }
  document.getElementById('copy-modal-text').textContent = msg;
  modal.querySelector('.copy-modal-overlay').classList.add('open');
  window._copyModalMsg = msg;
}
function closeCopyModal(){
  document.getElementById('copy-modal').querySelector('.copy-modal-overlay').classList.remove('open');
}
function copyModalMsg(){
  const txt = window._copyModalMsg;
  const btn = document.querySelector('.cm-copy-btn');
  function onSuccess(){
    btn.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Copied!';
    btn.style.background='rgba(34,197,94,.2)';btn.style.color='#4ade80';btn.style.borderColor='rgba(34,197,94,.4)';
    setTimeout(()=>{btn.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy message';btn.style.background='';btn.style.color='';btn.style.borderColor='';}, 2000);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(onSuccess).catch(fallbackCopy);
  } else { fallbackCopy(); }
  function fallbackCopy(){
    const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:-9999px;top:-9999px';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');onSuccess();}catch(e){}
    document.body.removeChild(ta);
  }
}
}
</script>
</body>
</html>
