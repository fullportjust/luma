<script>
/* ------------------------------------------------------------------
   Photos only. data/therapists.json is a plain array of image paths
   generated by scripts/build-therapists.js from img/therapists/.
   No names, roles, captions or per-person metadata are rendered.
   Photos must be plain, professional and non-sexual — clothed, neutral
   background. The slideshow rotates automatically and pauses on hover.
------------------------------------------------------------------- */
(function(){
  const host = document.getElementById('team-gallery');
  if(!host) return;

  const AUTOPLAY_MS = 4500;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  function render(items){
    const photos = (Array.isArray(items) ? items : [])
      .map(x => typeof x === 'string' ? x : (x && x.photo) || '')
      .filter(Boolean);

    if(!photos.length){
      host.innerHTML = `<div class="card" style="text-align:center;padding:2.2rem 1.4rem">
        <p class="lead" style="margin:0 auto" data-i18n="team.empty">New therapist photos are on the way — message us for today's lineup.</p>
      </div>`;
      if(typeof applyI18n === 'function') applyI18n();
      return;
    }

    const slides = photos.map((src, i) =>
      `<figure class="ls-slide${i === 0 ? ' is-active' : ''}"><img src="${esc(src)}" alt=""${i === 0 ? '' : ' loading="lazy"'} decoding="async"></figure>`
    ).join('');
    const arrows = photos.length > 1
      ? `<button class="ls-arrow prev" type="button" aria-label="Previous photo">&#8249;</button>
         <button class="ls-arrow next" type="button" aria-label="Next photo">&#8250;</button>`
      : '';
    const dots = photos.length > 1
      ? `<div class="ls-dots">${photos.map((_, i) =>
          `<button class="ls-dot${i === 0 ? ' is-active' : ''}" type="button" data-i="${i}" aria-label="Photo ${i + 1}"></button>`
        ).join('')}</div>`
      : '';

    host.innerHTML = `<div class="ls-viewport"><div class="ls-track">${slides}</div>${arrows}</div>${dots}`;

    let index = 0;
    let timer = null;
    const slidesEls = Array.from(host.querySelectorAll('.ls-slide'));
    const dotEls = Array.from(host.querySelectorAll('.ls-dot'));
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function show(n){
      index = (n + slidesEls.length) % slidesEls.length;
      slidesEls.forEach((el, i) => el.classList.toggle('is-active', i === index));
      dotEls.forEach((d, i) => d.classList.toggle('is-active', i === index));
    }
    function stop(){ if(timer){ clearInterval(timer); timer = null; } }
    function start(){
      stop();
      if(!reduced && slidesEls.length > 1) timer = setInterval(() => show(index + 1), AUTOPLAY_MS);
    }

    dotEls.forEach(d => d.addEventListener('click', () => { show(+d.dataset.i); start(); }));
    const prev = host.querySelector('.ls-arrow.prev');
    const next = host.querySelector('.ls-arrow.next');
    if(prev) prev.addEventListener('click', () => { show(index - 1); start(); });
    if(next) next.addEventListener('click', () => { show(index + 1); start(); });

    host.addEventListener('mouseenter', stop);
    host.addEventListener('mouseleave', start);
    host.addEventListener('focusin', stop);
    host.addEventListener('focusout', start);
    host.addEventListener('keydown', e => {
      if(e.key === 'ArrowLeft'){ show(index - 1); start(); }
      if(e.key === 'ArrowRight'){ show(index + 1); start(); }
    });
    document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

    start();
  }

  fetch('data/therapists.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : [])
    .then(data => render(Array.isArray(data) ? data : []))
    .catch(() => render([]));
})();

mountChrome('lineup.html');
</script>
</body>
