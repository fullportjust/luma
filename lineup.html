<script>
/* ------------------------------------------------------------------
   EDIT THIS LIST to add your therapists.
   Each entry: name, role, photo (path under img/), and an optional note.
   Photos should be plain, professional and non-sexual — a normal
   headshot / upper-body shot, clothed, on a neutral background.
   Leave photo "" to show a monogram placeholder until you add one.
------------------------------------------------------------------- */
const THERAPISTS = [
  { name: "Add name", role: "Therapist", photo: "" },
  { name: "Add name", role: "Therapist", photo: "" },
  { name: "Add name", role: "Therapist", photo: "" },
  { name: "Add name", role: "Therapist", photo: "" },
  { name: "Add name", role: "Therapist", photo: "" },
  { name: "Add name", role: "Therapist", photo: "" }
];

(function(){
  const grid = document.getElementById('team-grid');
  if(!grid) return;
  grid.innerHTML = THERAPISTS.map(p=>{
    const photo = p.photo
      ? `<img loading="lazy" src="${p.photo}" alt="${p.name}">`
      : `<div style="height:190px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:3rem;color:var(--gold);background:linear-gradient(135deg,#241848,#3a2560)">${(p.name||'?').trim().charAt(0).toUpperCase()}</div>`;
    return `<div class="card">
      ${photo}
      <div class="body">
        <h3>${p.name}</h3>
        <p>${p.role}</p>
        <a href="https://line.me/R/home/public/profile?id=370nwatk#~" class="btn btn-ghost" style="margin-top:.9rem;font-size:.7rem;padding:.6rem 1rem" data-i18n="team.avail">Message for availability</a>
      </div>
    </div>`;
  }).join('');
  if(typeof applyI18n === 'function') applyI18n();
})();

mountChrome('lineup.html');
</script>
